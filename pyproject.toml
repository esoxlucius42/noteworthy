[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noteworthy"
version = "0.1.0"
description = "A focused dark-themed desktop note manager"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
noteworthy = "noteworthy.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
